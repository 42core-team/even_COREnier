# Simplified Woodpecker CI Pipeline
# Basic equivalent to GitHub Actions build-game-server.yaml

when:
  event: [push, pull_request, manual]
  branch: [main, dev, event-*, rush-*]

steps:
  # Build for Pull Requests (test only)
  test-build:
    when:
      event: pull_request
    image: plugins/docker
    settings:
      dockerfile: .github/workflows/game-server-Dockerfile
      context: .
      dry_run: true
      platforms: linux/amd64,linux/arm64

  # Build and Push for main branches
  build-and-push:
    when:
      event: [push, manual]
    image: plugins/docker
    settings:
      dockerfile: .github/workflows/game-server-Dockerfile
      context: .
      registry: ghcr.io
      repo: ghcr.io/42core-team/game-server
      username:
        from_secret: github_username
      password:
        from_secret: github_token
      platforms: linux/amd64,linux/arm64
      tags:
        - ${CI_COMMIT_BRANCH}
        - ${CI_COMMIT_BRANCH}-${CI_COMMIT_SHA}
        - latest
      build_args:
        - BUILDKIT_INLINE_CACHE=1

  # Verify the build
  verify:
    when:
      event: [push, manual]
    image: docker:cli
    depends_on: [build-and-push]
    commands:
      - echo "Build completed successfully!"
      - echo "Branch: ${CI_COMMIT_BRANCH}"
      - echo "Commit: ${CI_COMMIT_SHA}"
      - echo "Image: ghcr.io/42core-team/game-server:${CI_COMMIT_BRANCH}"